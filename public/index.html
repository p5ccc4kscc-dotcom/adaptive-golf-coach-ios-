<!DOCTYPE html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <!-- viewport-fit=cover exposes the iPhone safe-area insets (notch, home indicator) to the app,
         which pads its header, tab bar and screens with them. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>%WEB_TITLE%</title>
    <!-- Name and icon used by Safari's "Add to Home Screen". -->
    <meta name="apple-mobile-web-app-title" content="BadGolfer" />
    <meta name="application-name" content="BadGolfer" />
    <link rel="apple-touch-icon" href="%BASE_URL%/apple-touch-icon.png" />
    <link rel="manifest" href="%BASE_URL%/manifest.webmanifest" />
    <meta name="theme-color" content="#F4F6F3" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0F1512" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      html,
      body {
        height: 100%;
        -webkit-text-size-adjust: 100%;
      }
      body {
        overflow: hidden;
        background-color: #F4F6F3;
      }
      @media (prefers-color-scheme: dark) {
        body { background-color: #0F1512; }
      }
      #root {
        display: flex;
        height: 100%;
        /* Follows Safari's toolbars as they show and hide, so the tab bar is never pushed off-screen. */
        height: 100dvh;
        flex: 1;
      }
    </style>
  </head>

  <body>
    <noscript>
      BadGolfer needs JavaScript to run.
    </noscript>
    <div id="root"></div>
  </body>
</html>
