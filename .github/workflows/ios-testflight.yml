name: iOS TestFlight build (EAS)

# Builds the signed BadGolfer iPhone app on EAS (Expo's cloud Macs) and submits it to TestFlight.
# No Mac and no interactive login: EAS creates and stores the signing certificate and provisioning
# profile using an App Store Connect API key.
#
# Start it (from the GitHub app or Safari):
# - Pull request: add the label "testflight" to the PR whose branch you want to install.
# - Or: Actions → "iOS TestFlight build (EAS)" → Run workflow (once this file is on main).
#
# Needs (Settings → Secrets and variables → Actions; see docs/BUILD_AND_RUN.md → "TestFlight setup"):
#   secrets:   EXPO_TOKEN, ASC_API_KEY_P8
#   variables: EAS_PROJECT_ID, ASC_KEY_ID, ASC_ISSUER_ID, APPLE_TEAM_ID, ASC_APP_ID,
#              EXPO_OWNER (optional), APPLE_TEAM_TYPE (optional, default INDIVIDUAL)
# Free Expo plan: 15 iOS builds a month (low-priority queue). Each run uses one.

on:
  pull_request:
    types: [labeled]
  workflow_dispatch:

concurrency:
  group: ios-testflight
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  testflight:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'testflight'
    name: Build on EAS and submit to TestFlight
    runs-on: ubuntu-latest
    # The free plan's low-priority queue can wait a long time before the build starts.
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check setup, write the API key privately, set identifiers for this run
        run: node scripts/prepare-eas-ci.mjs
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
          EAS_PROJECT_ID: ${{ vars.EAS_PROJECT_ID }}
          EXPO_OWNER: ${{ vars.EXPO_OWNER }}
          ASC_KEY_ID: ${{ vars.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ vars.ASC_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          ASC_APP_ID: ${{ vars.ASC_APP_ID }}
      - name: Build on EAS (signed, store distribution) and submit to TestFlight
        run: npx --yes eas-cli@24.10.0 build --platform ios --profile production --non-interactive --auto-submit --wait
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          # EXPO_ASC_API_KEY_PATH is set by the previous step.
          EXPO_ASC_KEY_ID: ${{ vars.ASC_KEY_ID }}
          EXPO_ASC_ISSUER_ID: ${{ vars.ASC_ISSUER_ID }}
          EXPO_APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          EXPO_APPLE_TEAM_TYPE: ${{ vars.APPLE_TEAM_TYPE || 'INDIVIDUAL' }}
      - name: Remove the key file
        if: always()
        run: rm -f "$RUNNER_TEMP"/AuthKey_*.p8
