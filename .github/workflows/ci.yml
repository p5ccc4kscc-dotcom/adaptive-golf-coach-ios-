name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Typecheck, lint, unit + UI tests, web build, browser E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test -- --ci
      - name: Export web preview
        run: npm run export:web
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser end-to-end tests (Chromium, iPhone-sized viewport)
        run: npx playwright test --output test-results/root
      - name: Export GitHub Pages-style build (sub-path)
        run: |
          rm -rf dist
          npm run export:pages
      - name: Browser end-to-end tests under the Pages sub-path
        run: npx playwright test --output test-results/pages
        env:
          BASE_PATH: /adaptive-golf-coach-ios-
      - name: Print page snapshots of failed browser tests
        if: failure()
        run: find test-results -name 'error-context.md' -print -exec cat {} \;
      - name: Upload browser test traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results
          retention-days: 7
      - name: Upload web build
        uses: actions/upload-artifact@v4
        with:
          name: web-preview-dist
          path: dist
          retention-days: 7

  upgrade:
    name: Upgrade keeps saved data (main build → this commit)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Build this commit (Pages sub-path)
        run: npm run export:pages && mv dist dist-new
      - name: Build the current main branch (Pages sub-path)
        run: |
          git worktree add ../base origin/main
          cd ../base
          npm ci
          npm run export:pages
          mv dist "$GITHUB_WORKSPACE/dist-old"
      - name: Enter fictional data in the main build, then open it with this commit's build
        run: node scripts/check-upgrade.mjs dist-old dist-new
