name: Deploy browser preview (GitHub Pages)

# Publishes the web build to https://p5ccc4kscc-dotcom.github.io/adaptive-golf-coach-ios-/
# One-time owner step: Settings → Pages → Build and deployment → Source: "GitHub Actions".

on:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Export web build under the repository sub-path
        run: npx expo export --platform web
        env:
          EXPO_BASE_URL: /${{ github.event.repository.name }}
      - name: SPA fallback for deep links
        run: cp dist/index.html dist/404.html && touch dist/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
