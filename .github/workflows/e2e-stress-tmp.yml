# TEMPORARY: investigates intermittent E2E failures seen on CI runs 3 and 4.
# Repeats the browser suite and prints page snapshots of any failure. Remove after diagnosis.
name: E2E stress (temporary diagnosis)

on:
  push:
    branches: ['claude/m0-foundation']

jobs:
  stress:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        base: ['', '/adaptive-golf-coach-ios-']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Export web build
        run: |
          npx expo export --platform web
          cp dist/index.html dist/404.html
        env:
          EXPO_BASE_URL: ${{ matrix.base }}
      - run: npx playwright install --with-deps chromium
      - name: Repeat E2E suite
        run: npx playwright test --repeat-each=6 --reporter=line
        env:
          BASE_PATH: ${{ matrix.base }}
      - name: Print failure snapshots
        if: failure()
        run: |
          find test-results -name 'error-context.md' | while read f; do echo "=== $f"; cat "$f"; done
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: stress-results${{ matrix.base == '' && '-root' || '-pages' }}
          path: test-results
