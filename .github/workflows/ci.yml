name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Typecheck, lint, unit + UI tests, web build, browser E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test -- --ci
      - name: Export web preview
        run: npx expo export --platform web
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser end-to-end tests (Chromium, iPhone-sized viewport)
        run: npx playwright test --output test-results/root
      - name: Export GitHub Pages-style build (sub-path)
        run: |
          rm -rf dist
          npx expo export --platform web
          cp dist/index.html dist/404.html
        env:
          EXPO_BASE_URL: /adaptive-golf-coach-ios-
      - name: Browser end-to-end tests under the Pages sub-path
        run: npx playwright test --output test-results/pages
        env:
          BASE_PATH: /adaptive-golf-coach-ios-
      - name: Print page snapshots of failed browser tests
        if: failure()
        run: find test-results -name 'error-context.md' -print -exec cat {} \;
      - name: Upload browser test traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results
          retention-days: 7
      - name: Upload web build
        uses: actions/upload-artifact@v4
        with:
          name: web-preview-dist
          path: dist
          retention-days: 7
